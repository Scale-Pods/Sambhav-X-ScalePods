name: Sheets sync

# One-way mirror: Google Sheets -> Supabase. Reads sheets, never writes to them.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-read every sheet even if unchanged"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sheets-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/sync/requirements.txt
      - run: pip install -r tools/sync/requirements.txt
      - name: Sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python tools/sync/sheets_sync.py ${{ inputs.force && '--force' || '' }}
