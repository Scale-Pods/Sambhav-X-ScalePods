name: Sheets sync

# One-way mirror: Google Sheets -> Supabase. Reads sheets, never writes to them.
# After the copy, the stock book (plates and sales) is brought up to date from the two live stock sheets: additions only, nothing is deleted or changed.
on:
  schedule:
    # once a day, 06:30 India time. The sheets are a temporary source until each part moves into the app, so a daily copy is enough;
    # a run can also be started by hand (Actions > Sheets sync > Run workflow) or by asking for a sync.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-read every sheet even if unchanged"
        type: boolean
        default: false
      stock_load:
        description: "Also bring the stock book up to date from the stock sheets afterwards"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: sheets-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/sync/requirements.txt
      - run: pip install -r tools/sync/requirements.txt
      - name: Sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python tools/sync/sheets_sync.py ${{ inputs.force && '--force' || '' }}
      - name: Stock book
        if: ${{ github.event_name == 'schedule' || inputs.stock_load }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python tools/import/stock_refresh.py --commit
